spring:
  application:
    name: proyecto

  # Perfil usado si no se activa ninguno explícitamente (SPRING_PROFILES_ACTIVE).
  # Desarrollo local -> H2 en memoria (application-dev.yml). Para producción con
  # MySQL, activa un perfil que no sea "dev" (o sobrescribe el datasource).
  profiles:
    default: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:turnos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # SMTP para los avisos al equipo. Igual que DB_*, todo por variables de entorno: aquí no
  # se escribe ninguna credencial ni ninguna dirección real, porque este fichero va al
  # repositorio y el .env no.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Sin SMTP_HOST no se envía nada: el aviso se escribe en el log y se informa al encargado
# de que no ha salido. Es el estado por defecto a propósito, para que un entorno de pruebas
# no pueda mandar correos de verdad a la plantilla por descuido.
rotateam:
  mail:
    from: ${MAIL_FROM:}
    enabled: ${MAIL_ENABLED:false}
