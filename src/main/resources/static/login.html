<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaTeam · Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <main class="page page-narrow">
        <div class="stack-6">
            <div class="stack-2">
                <h1>RotaTeam</h1>
                <p class="text-lead">Cuadrantes que encajan con tu equipo.</p>
            </div>

            <p id="status-message" class="notice" role="status" hidden></p>

            <div class="surface stack-5">
                <h2>Iniciar sesión</h2>

                <form id="login-form" method="post" action="/login">
                    <input type="hidden" name="_csrf" id="csrf-input">
                    <div class="field">
                        <label class="label" for="username-input">Correo electrónico</label>
                        <input class="input" type="email" name="username" id="username-input" required autofocus autocomplete="username">
                    </div>
                    <div class="field">
                        <label class="label" for="password-input">Contraseña</label>
                        <input class="input" type="password" name="password" id="password-input" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn--primary btn--block" style="margin-top:var(--s-5)">Iniciar sesión</button>
                </form>

                <button type="button" id="forgot-password-link" class="btn btn--quiet btn--block">He olvidado mi contraseña</button>
            </div>

            <div class="surface stack-5">
                <div class="stack-2">
                    <h2>Entrar como invitado</h2>
                    <p class="text-secondary">Para ver tu horario y fichar. No podrás editar nada.</p>
                </div>

                <div class="field">
                    <label class="label" for="guest-select">Tu nombre</label>
                    <select class="select" id="guest-select">
                        <option value="">Selecciona tu nombre</option>
                    </select>
                </div>

                <button type="button" id="guest-submit" class="btn btn--secondary btn--block">Entrar</button>
            </div>
        </div>
    </main>

    <script src="js/notice.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
