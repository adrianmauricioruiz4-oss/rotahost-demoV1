<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaHost — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <main class="page page-narrow" style="padding-top:80px">
        <div class="surface stack-5">
            <div>
                <h1 class="brand" style="padding:0">RotaHost</h1>
                <p class="text-secondary" style="margin-top:6px">Cuadrantes que encajan con tu equipo.</p>
            </div>

            <p id="status-message" class="notice notice--alert" hidden></p>

            <form id="login-form" class="stack-4" method="post" action="/login">
                <input type="hidden" name="_csrf" id="csrf-input">
                <div class="field">
                    <label class="label" for="username-input">Correo electrónico</label>
                    <input class="input" type="email" name="username" id="username-input" required autofocus>
                </div>
                <div class="field">
                    <label class="label" for="password-input">Contraseña</label>
                    <input class="input" type="password" name="password" id="password-input" required>
                </div>
                <button type="submit" class="btn btn--primary btn--block">Iniciar sesión</button>
            </form>

            <a href="#" id="forgot-password-link" class="text-secondary" style="text-align:center;display:block">¿Olvidaste tu contraseña?</a>

            <div class="stack-4" style="border-top:1px solid var(--line);padding-top:26px">
                <div class="field">
                    <label class="label" for="guest-select">Tu nombre</label>
                    <select class="select" id="guest-select">
                        <option value="">Selecciona tu nombre…</option>
                    </select>
                </div>
                <button type="button" id="guest-submit" class="btn btn--secondary btn--block">Entrar como invitado</button>
                <p class="text-caption">Solo para ver tu horario y fichar. No podrás editar nada.</p>
            </div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
