<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos — Empleados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <header id="shell-topbar"></header>

    <main class="page">
        <h1>Empleados</h1>

        <p id="status-message" class="notice notice--alert" style="margin-top:22px" hidden></p>

        <details class="expand-card" style="margin-top:22px">
            <summary><span class="es-name">Añadir empleado</span></summary>
            <form id="new-employee-form" class="expand-body stack-4"></form>
        </details>

        <h2 style="margin-top:34px">Equipo</h2>
        <p id="employees-empty" class="text-secondary" style="margin-top:10px" hidden>Todavía no hay empleados en este venue.</p>
        <div id="employees-list" style="margin-top:14px"></div>
    </main>

    <script src="js/shell.js"></script>
    <script src="js/employees.js"></script>
</body>
</html>
