<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaTeam · Empleados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="shell-sidebar"></aside>

        <div class="main">
            <div class="topbar">
                <h1 class="dash-title">Empleados</h1>
                <div class="spring"></div>
            </div>

            <main class="dash-main">
                <p id="status-message" class="status-message" hidden></p>

                <section class="settings-section">
                    <details class="new-employee-details">
                        <summary><span class="plus-icon">+</span> Añadir empleado</summary>
                        <form id="new-employee-form" class="employee-card"></form>
                    </details>
                </section>

                <section class="settings-section">
                    <h2>Equipo</h2>
                    <p id="employees-empty" hidden>Todavía no hay empleados en este venue.</p>
                    <div id="employees-list"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/shell.js"></script>
    <script src="js/employees.js"></script>
</body>
</html>
