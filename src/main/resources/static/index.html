<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos — Cuadrante semanal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <h1 id="venue-name">Turnos</h1>
        <p id="week-label">Genera un cuadrante para ver el DRAFT aquí.</p>
        <p class="app-nav">
            <a href="settings.html">Configuración del local y los turnos</a>
            · <a href="employee.html">Mi semana y mis preferencias</a>
        </p>
    </header>

    <main>
        <form id="generate-form" class="generate-form">
            <label>
                Venue ID
                <input type="number" id="venue-id-input" min="1" value="1" required>
            </label>
            <label>
                Año ISO
                <input type="number" id="iso-year-input" min="2000" required>
            </label>
            <label>
                Semana ISO
                <input type="number" id="iso-week-input" min="1" max="53" required>
            </label>
            <button type="submit" id="generate-button">Generar semana</button>
            <button type="button" id="publish-button" class="publish-button" hidden>Publicar cuadrante</button>
        </form>

        <p id="status-message" class="status-message" hidden></p>
        <ul id="uncovered-list" class="uncovered-list" hidden></ul>

        <div class="schedule-wrapper">
            <table id="schedule-table" class="schedule-table">
                <thead>
                    <tr id="schedule-head-row">
                        <th class="employee-col">Empleado</th>
                    </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
            </table>
        </div>
    </main>

    <script src="js/schedule.js"></script>
</body>
</html>
