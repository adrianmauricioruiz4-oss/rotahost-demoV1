<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos — Configuración</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Configuración</h1>
        <p class="app-nav">
            <a href="index.html">← Volver al cuadrante</a>
            <a href="#" id="logout-link">Cerrar sesión</a>
        </p>
    </header>

    <main>
        <p id="status-message" class="status-message" hidden></p>

        <section class="settings-section">
            <h2>Local</h2>
            <form id="venue-lookup-form" class="generate-form">
                <label>
                    Venue ID
                    <input type="number" id="venue-id-input" min="1" value="1" required>
                </label>
                <button type="submit">Cargar</button>
            </form>

            <form id="venue-edit-form" class="generate-form" hidden>
                <label>
                    Nombre
                    <input type="text" id="venue-name-input" required>
                </label>
                <label>
                    Apertura
                    <input type="time" id="venue-opening-input" required>
                </label>
                <label>
                    Cierre
                    <input type="time" id="venue-closing-input" required>
                </label>
                <button type="submit">Guardar horario del local</button>
            </form>
        </section>

        <section class="settings-section">
            <h2>Turnos</h2>
            <p id="shift-templates-empty" hidden>Carga primero un venue para ver sus turnos.</p>
            <div id="shift-templates-list"></div>
        </section>
    </main>

    <script src="js/settings.js"></script>
</body>
</html>
