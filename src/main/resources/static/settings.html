<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos — Configuración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="shell-sidebar"></aside>

        <div class="main">
            <div class="topbar">
                <h1 class="dash-title">Configuración</h1>
                <div class="spring"></div>
            </div>

            <main class="dash-main">
                <p id="status-message" class="status-message" hidden></p>

                <section class="settings-section">
                    <h2>General</h2>
                    <form class="generate-form">
                        <label>
                            Idioma
                            <select id="language-select">
                                <option value="es">Español</option>
                                <option value="en" disabled>English (próximamente)</option>
                            </select>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="notifications-toggle" checked>
                            Avisarme cuando haya huecos de cobertura sin cubrir
                        </label>
                    </form>
                </section>

                <section class="settings-section">
                    <h2>Local</h2>
                    <form id="venue-edit-form" class="generate-form" hidden>
                        <label>
                            Nombre
                            <input type="text" id="venue-name-input" required>
                        </label>
                        <label>
                            Apertura
                            <input type="time" id="venue-opening-input" required>
                        </label>
                        <label>
                            Cierre
                            <input type="time" id="venue-closing-input" required>
                        </label>
                        <button type="submit">Guardar horario del local</button>
                    </form>
                </section>

                <section class="settings-section">
                    <h2>Turnos</h2>
                    <p id="shift-templates-empty" hidden>Carga primero un venue para ver sus turnos.</p>
                    <div id="shift-templates-list"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="js/shell.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
