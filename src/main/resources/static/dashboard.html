<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaTeam · Panel principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <div class="sidebar" id="shell-nav"></div>

    <main class="page stack-6">
        <div class="stack-2">
            <h1>Panel principal</h1>
            <p class="text-lead" id="dash-venue-name">Cargando el resumen de tu local</p>
        </div>

        <p id="status-message" class="notice" role="status" hidden></p>

        <!-- Las incidencias van arriba, antes de las métricas (DESIGN.md, panel admin). -->
        <section class="stack-3" id="dash-alerts-section" hidden>
            <h2>Conflictos pendientes</h2>
            <div class="stack-3" id="dash-alerts-list"></div>
        </section>

        <section class="stack-4" id="dash-stats" hidden>
            <h2 class="sr-only">Resumen de la semana</h2>
            <div class="grid-3">
                <div class="tile">
                    <div class="tile-n" id="dash-employee-count">—</div>
                    <div class="tile-l">Empleados activos</div>
                </div>
                <div class="tile">
                    <div class="tile-n" id="dash-week-number">—</div>
                    <div class="tile-l" id="dash-week-label">Semana en curso</div>
                </div>
                <div class="tile" id="dash-alerts-tile">
                    <div class="tile-n" id="dash-alerts-count">—</div>
                    <div class="tile-l">Conflictos por revisar</div>
                </div>
            </div>
        </section>

        <section class="surface stack-4" id="dash-schedule-section" hidden>
            <div class="row-between">
                <h2>Cuadrante de esta semana</h2>
                <span class="pill pill--off" id="dash-status-badge">
                    <span class="mark mark--ring" id="dash-status-mark"></span>
                    <span id="dash-status-text">Sin generar</span>
                </span>
            </div>
            <p class="text-secondary" id="dash-schedule-hint">Nada se publica sin que tú lo revises antes.</p>

            <!-- Cuánta gente hay cada día por franja: el vistazo rápido, sin abrir el cuadrante. -->
            <div class="rota-wrap" id="dash-band-wrap" hidden>
                <table class="rota" id="dash-band-table">
                    <thead><tr id="dash-band-head"></tr></thead>
                    <tbody id="dash-band-body"></tbody>
                </table>
            </div>

            <a class="btn btn--primary" href="index.html">Ver el cuadrante</a>
        </section>
    </main>

    <script src="js/notice.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/bands.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
