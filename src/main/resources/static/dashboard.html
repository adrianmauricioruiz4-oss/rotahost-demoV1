<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos · Panel principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <header id="shell-topbar"></header>

    <main class="page">
        <h1>Panel principal</h1>
        <p class="text-lead" id="dash-venue-name" style="margin-top:8px">—</p>

        <p id="status-message" class="notice notice--alert" style="margin-top:22px" hidden></p>

        <section class="grid-2" id="dash-stats" style="margin-top:22px" hidden>
            <div class="tile">
                <div class="tile-n" id="dash-employee-count">—</div>
                <div class="tile-l">Empleados activos</div>
            </div>
            <div class="tile">
                <div style="padding-top:4px">
                    <span class="pill" id="dash-status-badge"><span class="mark mark--dot"></span><span id="dash-status-text">—</span></span>
                </div>
                <div class="tile-l" id="dash-week-label">Cuadrante de esta semana</div>
            </div>
        </section>

        <section style="margin-top:34px" id="dash-alerts-section" hidden>
            <h2>Alertas y conflictos pendientes</h2>
            <div class="stack-3" id="dash-alerts-list" style="margin-top:14px"></div>
        </section>
    </main>

    <script src="js/shell.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
