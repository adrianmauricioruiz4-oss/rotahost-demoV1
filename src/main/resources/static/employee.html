<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos — Mi semana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <header id="shell-topbar"></header>

    <main class="page">
        <div class="row-between">
            <h1>Mi semana</h1>
            <span class="text-secondary" id="whoami-label"></span>
        </div>

        <p id="status-message" class="notice notice--alert" style="margin-top:22px" hidden></p>

        <section style="margin-top:22px">
            <form id="lookup-form" class="row-between" style="flex-wrap:wrap;gap:16px">
                <div class="field" id="employee-select-field" style="margin:0" hidden>
                    <label class="label" for="employee-select">Ver semana de</label>
                    <select class="select" id="employee-select"></select>
                </div>
                <div class="week-nav">
                    <button type="button" class="btn btn--secondary btn--icon" id="wk-prev" aria-label="Semana anterior">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <div class="week-fields">
                        Semana
                        <input type="number" id="iso-week-input" min="1" max="53" class="input--week" required>
                        ·
                        <input type="number" id="iso-year-input" min="2000" class="input--year" required>
                    </div>
                    <button type="button" class="btn btn--secondary btn--icon" id="wk-next" aria-label="Semana siguiente">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                </div>
                <button type="submit" class="btn btn--primary">Ver semana</button>
            </form>
        </section>

        <section style="margin-top:34px">
            <h2 id="employee-heading" hidden></h2>
            <div class="surface" style="margin-top:14px;padding:0 24px">
                <table class="table" id="week-table">
                    <thead>
                        <tr><th scope="col">Día</th><th scope="col">Turno</th></tr>
                    </thead>
                    <tbody id="week-body-row"></tbody>
                </table>
            </div>
        </section>

        <section id="timeclock-section" style="margin-top:34px" hidden>
            <h2>Fichar</h2>
            <div class="status-block status-block--out" id="timeclock-block" style="margin-top:14px;max-width:340px">
                <p class="status-line"><span class="mark mark--ring" id="timeclock-mark"></span><span id="timeclock-status-label">Fuera de turno</span></p>
                <p class="text-secondary" id="timeclock-status" style="margin-top:10px"></p>
            </div>
            <button type="button" id="timeclock-button" class="btn btn--primary btn--hero" style="margin-top:14px;max-width:340px"></button>
        </section>

        <section id="preferences-section" style="margin-top:34px">
            <h2>Mis preferencias</h2>
            <div class="surface" style="margin-top:14px;padding:0 24px">
                <table class="table">
                    <thead><tr><th scope="col">Preferencia</th><th scope="col" class="right">Acción</th></tr></thead>
                    <tbody id="preferences-list"></tbody>
                </table>
            </div>

            <form id="preference-form" class="surface stack-4" style="margin-top:22px;max-width:480px">
                <fieldset id="preference-fieldset" class="stack-4" style="border:none;padding:0;margin:0" disabled>
                    <div class="field">
                        <label class="label" for="pref-type-input">Tipo</label>
                        <select class="select" id="pref-type-input">
                            <option value="PREFERS_DAY">Prefiero un día</option>
                            <option value="AVOIDS_DAY">Evito un día</option>
                            <option value="PREFERS_SHIFT">Prefiero un turno</option>
                            <option value="AVOIDS_SHIFT">Evito un turno</option>
                            <option value="UNAVAILABLE">No disponible (fecha concreta)</option>
                        </select>
                    </div>
                    <div class="field" id="pref-day-field">
                        <label class="label" for="pref-day-input">Día de la semana</label>
                        <select class="select" id="pref-day-input">
                            <option value="MONDAY">Lunes</option>
                            <option value="TUESDAY">Martes</option>
                            <option value="WEDNESDAY">Miércoles</option>
                            <option value="THURSDAY">Jueves</option>
                            <option value="FRIDAY">Viernes</option>
                            <option value="SATURDAY">Sábado</option>
                            <option value="SUNDAY">Domingo</option>
                        </select>
                    </div>
                    <div class="field" id="pref-shift-field" hidden>
                        <label class="label" for="pref-shift-input">Turno</label>
                        <select class="select" id="pref-shift-input"></select>
                    </div>
                    <div class="field" id="pref-date-field" hidden>
                        <label class="label" for="pref-date-input">Fecha</label>
                        <input class="input" type="date" id="pref-date-input">
                    </div>
                    <div class="field" id="pref-weight-field">
                        <label class="label" for="pref-weight-input">Peso (1-5)</label>
                        <input class="input" type="number" id="pref-weight-input" min="1" max="5" value="3">
                    </div>
                    <button type="submit" class="btn btn--primary">Añadir preferencia</button>
                </fieldset>
            </form>
            <p id="preference-hint" class="text-secondary" style="margin-top:14px">Consulta tu semana para poder añadir preferencias.</p>
        </section>
    </main>

    <script src="js/shell.js"></script>
    <script src="js/employee.js"></script>
</body>
</html>
